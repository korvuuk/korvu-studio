name: privacidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  varredura:
    name: Segredos e dados pessoais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura do projeto (tokens, caminhos pessoais, e-mails, IDs)
        run: python3 -I scripts/varrer_privacidade.py
      - name: gitleaks (histórico inteiro)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
