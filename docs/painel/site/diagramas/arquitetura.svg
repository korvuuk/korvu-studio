<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="Arquitetura do korvu. painel: os arquivos do projeto são lidos pelo sincronizar.py, que grava numa transação no Postgres 17 local; o Next.js lê pela API do Supabase com a chave service_role e entrega HTML ao navegador, tudo em 127.0.0.1. Os números 1 a 7 seguem o veredicto de um portão até a tela.">
