<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" role="img" aria-label="Fluxograma do sincronizar.py: três gatilhos, a leitura só de leitura dos arquivos, a gravação numa transação, os três erros que param a passagem e o que ele nunca toca.">
<style>
.dg-bg{fill:#f5f2e8}
text{font-family:Geist,Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.dg-box{fill:#fbf9f4;stroke:#928874;stroke-width:1}
.dg-soft{fill:#efebe0;stroke:#e4dfd2;stroke-width:1}
.dg-dec{fill:#f5f2e8;stroke:#111111;stroke-width:1.5}
.dg-ink{fill:#111111;stroke:#111111;stroke-width:1}
.dg-hl{fill:#ffe8dc;stroke:none}
.dg-zone{fill:none;stroke:#928874;stroke-width:1;stroke-dasharray:5 5}
.dg-errb{fill:#fbe3df;stroke:#c2271b;stroke-width:1}
.dg-okb{fill:#e3f0e4;stroke:#1e7a45;stroke-width:1}
.dg-t{fill:#111111;font-size:13px;font-weight:600}
.dg-s{fill:#6b6458;font-size:11px;font-weight:500}
.dg-m{fill:#6b6458;font-size:10.5px;font-weight:500;font-family:"Geist Mono",ui-monospace,monospace !important}
.dg-mi{fill:#111111;font-size:12px;font-weight:600;font-family:"Geist Mono",ui-monospace,monospace !important}
.dg-fk{fill:#b33600;font-size:10.5px;font-weight:500;font-family:"Geist Mono",ui-monospace,monospace !important}
.dg-hlt{fill:#b33600;font-size:10.5px;font-weight:600;font-family:"Geist Mono",ui-monospace,monospace !important}
.dg-cap{fill:#6b6458;font-size:10.5px;font-weight:600;letter-spacing:.08em}
.dg-lbl{fill:#6b6458;font-size:10.5px;font-weight:600}
.dg-inkt{fill:#f5f2e8;font-size:13px;font-weight:600}
.dg-inks{fill:#f5f2e8;font-size:10.5px;font-weight:500;font-family:"Geist Mono",ui-monospace,monospace !important}
.dg-errt{fill:#c2271b;font-size:12px;font-weight:600}
.dg-errs{fill:#c2271b;font-size:10.5px;font-weight:500}
.dg-okt{fill:#1e7a45;font-size:13px;font-weight:600}
.dg-oks{fill:#1e7a45;font-size:10.5px;font-weight:500}
.dg-acc{fill:none;stroke:#ff4d00;stroke-width:2;stroke-linejoin:round}
.dg-ln{fill:none;stroke:#6b6458;stroke-width:1.25;stroke-linejoin:round}
.dg-dash{fill:none;stroke:#6b6458;stroke-width:1.25;stroke-dasharray:5 4;stroke-linejoin:round}
.dg-err{fill:none;stroke:#c2271b;stroke-width:1.25;stroke-dasharray:5 4}
.dg-aha{fill:#ff4d00}
.dg-ahn{fill:#6b6458}
.dg-ahe{fill:#c2271b}
.dg-num{fill:#ff4d00;stroke:#fbf9f4;stroke-width:2}
.dg-numt{fill:#111111;font-size:11px;font-weight:700}
</style>
<defs><marker id="sync-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-aha" d="M0 0L10 5L0 10z"/></marker><marker id="sync-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ahn" d="M0 0L10 5L0 10z"/></marker><marker id="sync-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ahe" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="dg-bg" x="0" y="0" width="1100" height="790"/>
<rect class="dg-box" x="150" y="16" width="200" height="54" rx="10"/>
<text class="dg-t" x="166" y="38">launchd</text>
<text class="dg-s" x="166" y="57">a cada 900 s</text>
<rect class="dg-box" x="380" y="16" width="240" height="54" rx="10"/>
<text class="dg-t" x="396" y="38">RunAtLoad</text>
<text class="dg-s" x="396" y="57">ao entrar na sessão do Mac</text>
<rect class="dg-box" x="650" y="16" width="330" height="54" rx="10"/>
<text class="dg-t" x="666" y="38">manual</text>
<text class="dg-m" x="666" y="57">uv run python painel/sync/sincronizar.py</text>
<path class="dg-acc" d="M250 70 V90 H510 M815 70 V90 H510"/>
<path class="dg-acc" d="M510 70 V106" marker-end="url(#sync-a)"/>
<rect class="dg-box" x="360" y="110" width="300" height="52" rx="10"/>
<text class="dg-t" x="376" y="132">ler_projeto()</text>
<text class="dg-s" x="376" y="151">lê os arquivos do quadro à esquerda</text>
<rect class="dg-box" x="20" y="110" width="310" height="333" rx="10"/>
<text class="dg-t" x="36" y="134">o que lê (só leitura)</text>
<text class="dg-m" x="36" y="158">.claude/agents/*.md · painel/equipe.yaml</text>
<text class="dg-m" x="36" y="177">videos/*/portoes.json (portoes.py)</text>
<text class="dg-m" x="36" y="196">_controle/tracker.md · status.json</text>
<text class="dg-m" x="36" y="215">roteiro.json · ARQUIVADO.json</text>
<text class="dg-m" x="36" y="234">brutos/principal/ (só listagem e stat)</text>
<text class="dg-m" x="36" y="253">05-render-pronto/*/pacote.json</text>
<text class="dg-m" x="36" y="272">06-publicar/* · 07-publicados/*</text>
<text class="dg-m" x="36" y="291">_controle/perfil/ · calendario.md</text>
<text class="dg-m" x="36" y="310">_controle/nao-publicar.json</text>
<text class="dg-m" x="36" y="329">videos/*/material/** · brutos/extras/**</text>
<text class="dg-m" x="36" y="348">00-marca/cor/ · painel/biblioteca.yaml</text>
<text class="dg-m" x="36" y="367">remotion/src/brand.ts · animacoes/*/brief.md</text>
<text class="dg-m" x="36" y="386">.claude/agents · skills · commands</text>
<text class="dg-m" x="36" y="405">painel/cambio.yaml · PRECOS (no código)</text>
<text class="dg-m" x="36" y="424">registros .jsonl + agent-&lt;id&gt;.meta.json</text>
<path class="dg-ln" d="M330 136 H356" marker-end="url(#sync-n)"/>
<rect class="dg-dec" x="360" y="200" width="300" height="48" rx="24"/>
<text class="dg-t" x="510" y="229" text-anchor="middle">todo arquivo legível?</text>
<path class="dg-acc" d="M510 162 V196" marker-end="url(#sync-a)"/>
<rect class="dg-errb" x="700" y="198" width="380" height="52" rx="10"/>
<text class="dg-errt" x="716" y="220">✗ … nada gravado</text>
<text class="dg-errs" x="716" y="238">exit 1</text>
<path class="dg-err" d="M660 224 H696" marker-end="url(#sync-e)"/>
<text class="dg-lbl" x="678" y="216" text-anchor="middle">não</text>
<path class="dg-acc" d="M510 248 V286" marker-end="url(#sync-a)"/>
<text class="dg-lbl" x="518" y="272">sim</text>
<rect class="dg-box" x="360" y="290" width="300" height="52" rx="10"/>
<text class="dg-t" x="376" y="312">gravar()</text>
<text class="dg-s" x="376" y="332">abre o Postgres pelo PAINEL_DB_URL (psycopg)</text>
<path class="dg-acc" d="M510 342 V376" marker-end="url(#sync-a)"/>
<rect class="dg-dec" x="360" y="380" width="300" height="48" rx="24"/>
<text class="dg-t" x="510" y="409" text-anchor="middle">banco no ar?</text>
<rect class="dg-errb" x="700" y="378" width="380" height="52" rx="10"/>
<text class="dg-errt" x="716" y="400">✗ banco do painel fora do ar</text>
<text class="dg-errs" x="716" y="418">ligar com: bash painel/iniciar.sh · exit 1</text>
<path class="dg-err" d="M660 404 H696" marker-end="url(#sync-e)"/>
<text class="dg-lbl" x="678" y="396" text-anchor="middle">não</text>
<path class="dg-acc" d="M510 428 V466" marker-end="url(#sync-a)"/>
<text class="dg-lbl" x="518" y="452">sim</text>
<rect class="dg-box" x="360" y="470" width="300" height="104" rx="10"/>
<text class="dg-t" x="376" y="492">uma transação só</text>
<text class="dg-s" x="376" y="512">truncate das 29 tabelas-espelho + insert</text>
<text class="dg-s" x="376" y="530">execucoes e uso_execucao: nunca truncadas</text>
<text class="dg-s" x="376" y="548">regrava o que o .jsonl ainda mostra; o que</text>
<text class="dg-s" x="376" y="566">sumiu fica com registro_presente = false</text>
<rect class="dg-soft" x="700" y="482" width="380" height="52" rx="10"/>
<text class="dg-t" x="716" y="504">⚠ anomalia que não para a passagem</text>
<text class="dg-s" x="716" y="522">vira uma linha ⚠ na saída</text>
<path class="dg-dash" d="M660 508 H696" marker-end="url(#sync-n)"/>
<path class="dg-acc" d="M510 574 V606" marker-end="url(#sync-a)"/>
<rect class="dg-dec" x="360" y="610" width="300" height="48" rx="24"/>
<text class="dg-t" x="510" y="639" text-anchor="middle">o banco aceitou?</text>
<rect class="dg-errb" x="700" y="608" width="380" height="52" rx="10"/>
<text class="dg-errt" x="716" y="630">✗ recusa do banco (FK, chave repetida)</text>
<text class="dg-errs" x="716" y="648">DETAIL do Postgres · transação desfeita</text>
<path class="dg-err" d="M660 634 H696" marker-end="url(#sync-e)"/>
<text class="dg-lbl" x="678" y="626" text-anchor="middle">não</text>
<path class="dg-acc" d="M510 658 V696" marker-end="url(#sync-a)"/>
<text class="dg-lbl" x="518" y="682">sim</text>
<rect class="dg-okb" x="360" y="700" width="300" height="56" rx="10"/>
<text class="dg-okt" x="376" y="723">passagem gravada</text>
<text class="dg-oks" x="376" y="742">1 linha em sincronizacoes (guarda 7 dias)</text>
<text class="dg-lbl" x="700" y="690">Em todo erro, o painel continua mostrando</text>
<text class="dg-lbl" x="700" y="706">a passagem anterior.</text>
<rect class="dg-ink" x="20" y="483" width="310" height="177" rx="10"/>
<text class="dg-inkt" x="36" y="507">nunca escreve em / nunca faz</text>
<text class="dg-inks" x="36" y="531">videos/ · 00-marca/</text>
<text class="dg-inks" x="36" y="550">_controle/ · scripts/</text>
<text class="dg-inks" x="36" y="569">~/.claude (só lê os registros)</text>
<text class="dg-inks" x="36" y="588">portoes.SO_LEITURA = True</text>
<text class="dg-inks" x="36" y="607">sys.dont_write_bytecode = True</text>
<text class="dg-inks" x="36" y="626">vídeos: nenhum é aberto</text>
<text class="dg-inks" x="36" y="645">nenhum texto de conversa no banco</text>
</svg>
