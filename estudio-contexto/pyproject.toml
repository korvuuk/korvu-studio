[project]
name = "estudio-contexto"
version = "0.1.0"
description = "Contexto do estúdio Korvu Studio: grafo de entidades, busca híbrida local e servidor MCP somente leitura"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "mcp>=1.2,<2",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
